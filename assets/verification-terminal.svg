<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" role="img" aria-labelledby="title desc">
  <title id="title">sshhole-lab verification terminal</title>
  <desc id="desc">The Docker verifier command and its successful auditdirectory account output.</desc>
  <rect x="8" y="8" width="1104" height="374" rx="20" fill="#0b1220" stroke="#26364b" stroke-width="2"/>
  <path d="M28 8h1064a20 20 0 0 1 20 20v42H8V28A20 20 0 0 1 28 8Z" fill="#172335"/>
  <circle cx="37" cy="39" r="7" fill="#ff6f6b"/>
  <circle cx="62" cy="39" r="7" fill="#ffc65c"/>
  <circle cx="87" cy="39" r="7" fill="#63d69b"/>
  <text x="120" y="45" fill="#b6c4d5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">terminal — sshhole-lab / isolated verifier</text>
  <rect x="916" y="24" width="162" height="30" rx="15" fill="#153b32"/>
  <text x="997" y="44" text-anchor="middle" fill="#8af0cf" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.3">VERIFICATION PASSED</text>
  <text x="38" y="111" fill="#8af0cf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">$</text>
  <text x="62" y="111" fill="#e5edf6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">docker compose --profile verify run --rm verify-lab</text>
  <text x="38" y="160" fill="#9cabc0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">Warning: Permanently added '[vulnerable-ssh]:2222' (ED25519) to the list of known hosts.</text>
  <text x="38" y="216" fill="#c5d2e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">uid=1000(auditdirectory) gid=1000(auditdirectory) groups=1000(auditdirectory)</text>
  <text x="38" y="272" fill="#8af0cf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">[exit status 0]</text>
  <path d="M38 314h1044" stroke="#26364b" stroke-width="1"/>
  <text x="38" y="350" fill="#71859c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Recorded from the repo's verifier running only on its private Docker network.</text>
</svg>
